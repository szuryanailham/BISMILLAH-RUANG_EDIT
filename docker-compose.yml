version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ruang-edit-app
        volumes:
            - .:/var/www/html
        networks:
            - ruang-edit-net
        depends_on:
            - mysql

    mysql:
        image: mysql:8.0
        container_name: ruang-edit-mysql
        environment:
            MYSQL_DATABASE: ruang_edit
            MYSQL_ROOT_PASSWORD: secret
        volumes:
            - ruang-edit-db:/var/lib/mysql
        networks:
            - ruang-edit-net

    nginx:
        image: nginx:alpine
        container_name: ruang-edit-nginx
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - ruang-edit-net

networks:
    ruang-edit-net:

volumes:
    ruang-edit-db:
